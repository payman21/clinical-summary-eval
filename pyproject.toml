[project]
name = "clinsum"
version = "0.1.0"
description = "Clinical summary faithfulness evaluation and distillation on MIMIC-IV"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.103",
    "duckdb>=1.5.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinsum"]
